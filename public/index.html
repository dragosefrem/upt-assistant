<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPT Route Video</title>
<style>
  :root { --blue:#00135f; --gold:#ffc20e; --bg:#f4f6fb; --ink:#14181f; --muted:#5b6472; --card:#fff; --line:#d9deea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b1020; --ink:#eef1f8; --muted:#9aa4b8; --card:#141b30; --line:#27304a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--blue); color:#fff; padding:18px 16px; }
  header h1 { margin:0; font-size:20px; } header p { margin:2px 0 0; opacity:.8; font-size:14px; }
  main { max-width:880px; margin:0 auto; padding:20px 16px 48px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; }
  .row { display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:end; }
  @media (max-width:640px){ .row { grid-template-columns:1fr; } #swap { justify-self:center; } }
  label { display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:4px; }
  input { width:100%; padding:11px 12px; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; }
  input:focus-visible, button:focus-visible { outline:3px solid var(--gold); outline-offset:1px; }
  button { font:inherit; cursor:pointer; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:10px 14px; }
  #go { margin-top:14px; width:100%; background:var(--blue); color:#fff; border-color:var(--blue); font-weight:600; padding:12px; }
  #go:disabled { opacity:.55; cursor:not-allowed; }
  #status { margin-top:16px; min-height:1.5em; color:var(--muted); }
  #status.error { color:#c0392b; }
  progress { width:100%; height:10px; margin-top:8px; accent-color:var(--gold); }
  #result { margin-top:18px; display:none; }
  video { width:100%; border-radius:12px; background:#000; aspect-ratio:16/9; }
  .meta { margin:10px 0 0; color:var(--muted); font-size:14px; }
  .note { margin-top:8px; padding:10px 12px; border-left:4px solid var(--gold); background:var(--bg); border-radius:6px; font-size:14px; }
</style>
</head>
<body>
<header>
  <h1>Route video</h1>
  <p>Pick where you are and where you want to go. We'll walk you there through the UPT 360° tour.</p>
</header>
<main>
  <section class="card">
    <div class="row">
      <div><label for="from">I am here</label><input id="from" list="places" autocomplete="off" placeholder="Start typing a place…"></div>
      <button id="swap" type="button" title="Swap" aria-label="Swap start and destination">⇄</button>
      <div><label for="to">I want to go to</label><input id="to" list="places" autocomplete="off" placeholder="Start typing a place…"></div>
    </div>
    <datalist id="places"></datalist>
    <button id="go" type="button" disabled>Generate route video</button>
    <div id="status" role="status" aria-live="polite"></div>
    <progress id="bar" max="100" value="0" hidden></progress>
  </section>

  <section id="result" class="card">
    <video id="video" controls playsinline></video>
    <p class="meta" id="meta"></p>
    <div class="note" id="note" hidden></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const label = (p) => (p.area ? `${p.name} — ${p.area}` : p.name);
let byLabel = new Map();

function setStatus(text, isError = false) {
  $('status').textContent = text;
  $('status').className = isError ? 'error' : '';
}
function refresh() { $('go').disabled = !(byLabel.has($('from').value) && byLabel.has($('to').value)); }

async function loadPlaces() {
  const places = await (await fetch('/api/places')).json();
  const seen = new Map();
  for (const p of places) { // names can repeat within an area, so make labels unique
    let l = label(p);
    const n = (seen.get(l) ?? 0) + 1;
    seen.set(l, n);
    if (n > 1) l += ` (#${n})`;
    byLabel.set(l, p.index);
    const o = document.createElement('option');
    o.value = l;
    $('places').appendChild(o);
  }
}

async function generate() {
  const from = byLabel.get($('from').value), to = byLabel.get($('to').value);
  $('go').disabled = true; $('result').style.display = 'none';
  $('bar').hidden = false; $('bar').value = 0;
  setStatus('Planning your route…');
  try {
    const r = await fetch('/api/route', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ from, to }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Request failed');
    if (data.status === 'done') return show(data, data.videoUrl);

    for (;;) {
      await new Promise((res) => setTimeout(res, 1500));
      const j = await (await fetch(`/api/jobs/${data.jobId}`)).json();
      if (j.status === 'error') throw new Error(j.error || j.message);
      $('bar').value = j.total ? Math.round((j.step / j.total) * 100) : 0;
      setStatus(j.status === 'queued' ? 'Waiting for a free slot…' : j.message);
      if (j.status === 'done') return show(data, j.videoUrl);
    }
  } catch (e) {
    setStatus(e.message, true);
  } finally {
    $('bar').hidden = true; refresh();
  }
}

function show(route, url) {
  setStatus('');
  $('video').src = url;
  $('video').load();
  $('result').style.display = 'block';
  $('meta').textContent = `${route.hops} steps along the way.`;
  $('note').hidden = !route.aerialJumps;
  if (route.aerialJumps)
    $('note').textContent = 'Part of this route is not connected on foot in the tour, so the video uses the aerial map to jump between areas.';
  $('video').play().catch(() => {});
}

for (const id of ['from', 'to']) $(id).addEventListener('input', refresh);
$('swap').onclick = () => { [$('from').value, $('to').value] = [$('to').value, $('from').value]; refresh(); };
$('go').onclick = generate;
loadPlaces().then(refresh).catch(() => setStatus('Could not load the list of places.', true));
</script>
</body>
</html>
